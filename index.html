<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1 class="title">My Tasks</h1>
    <div class="content-layout">
      <div class="left-column">
        <form id="todo-form" class="todo-form">
          <select id="category-select" class="category-select">
            <option value="work">업무</option>
            <option value="personal" selected>개인</option>
            <option value="study">공부</option>
          </select>
          <input type="text" id="todo-input" class="todo-input" placeholder="새로운 할 일을 입력하세요" autocomplete="off">
          <button type="submit" id="add-btn" class="add-btn">추가</button>
        </form>
        <div class="progress-container">
          <div id="progress-text" class="progress-text">0/0 완료 (0%)</div>
          <div class="progress-bar-bg">
            <div id="progress-bar-fill" class="progress-bar-fill"></div>
          </div>
        </div>
      </div>
      <div class="right-column">
        <div class="search-box">
          <input type="text" id="search-input" class="search-input" placeholder="할 일 검색..." autocomplete="off">
        </div>
        <div id="filter-buttons" class="filter-buttons">
          <button type="button" class="filter-btn active" data-filter="all">전체</button>
          <button type="button" class="filter-btn" data-filter="work">업무</button>
          <button type="button" class="filter-btn" data-filter="personal">개인</button>
          <button type="button" class="filter-btn" data-filter="study">공부</button>
        </div>
        <ul id="todo-list" class="todo-list"></ul>
        <div class="list-footer">
          <button type="button" id="clear-completed-btn" class="clear-completed-btn">완료된 항목 삭제</button>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
